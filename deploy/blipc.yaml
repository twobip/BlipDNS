listen: "0.0.0.0:8500"
# Auth for the web UI / API. blipc uses username/password session auth: you log
# in once via the web UI (or /api/login) and receive an HttpOnly + SameSite=Strict
# Empty credentials keep the controller CLOSED until the one-time setup flow
# creates the administrator account. Do not deploy an open controller.
username: "admin"
# Password may be either a BCRYPT HASH (recommended — keeps the plaintext out of
# the config file) or a plaintext password (hashed in-memory at startup).
# Generate a hash, e.g.:
#   htpasswd -bnBC 10 "" "your-password" | tr -d ':\n'
# then use `password_hash` (preferred). If `password_hash` is set it wins.
password: ""            # plaintext — only for local testing / first boot
# password_hash: "$2b$10$..."   # bcrypt hash — use this in production
# Optional env overrides: BLIPC_USER, BLIPC_PASS, BLIPC_PASS_HASH

# Fleet-wide plain-HTTP DoH listener. blipd already serves DoH over HTTPS on its
# doh_addr (self-signed cert). Set this to also listen for plain-text HTTP DoH
# (e.g. "0.0.0.0:8445") so non-TLS clients can reach it. "" = off. Per-instance
# overrides can be set from the Settings -> DoH panel.
doh_http_addr: ""
# Fleet-wide default policy (upstreams etc.). blipc is the source of truth:
# it persists this and distributes it to every blipd instance on save, and to
# instances as they come online / are adopted. Edited from the web UI too.
# upstream supports the same spec + |priority syntax as blipd (see blipd.yaml).
default_policy:
  id: "default"
  upstream: "udp://1.1.1.1:53|1 https://1.1.1.1/dns-query|2"
  block_action: "nxdomain"
  log: true
# Fleet-wide named upstream pool + conditional-forwarding routes. When set,
# blipc pushes them to every instance (a server with priority 0 is route-only;
# priority > 0 participates in the automatic failover rotation). Per-instance
# overrides can be set from the Settings -> Conditional Forwarding panel.
# Leave empty to let each instance use its own config-file upstream.
# upstream_servers:
#   - name: "cloudflare"
#     address: "udp://1.1.1.1:53"
#     priority: 1
#   - name: "quad9"
#     address: "udp://9.9.9.9:53"
#     priority: 2
#   - name: "internal"
#     address: "udp://10.0.0.53:53"
#     priority: 0 # route-only: never used unless a route points at it
# upstream_routes:
#   - name: "split-tunnel"
#     qname_suffix: ".internal.corp."
#     server: "internal"
#     client_cidr: "10.0.0.0/8"
# Bootstrap DNS servers: used to resolve the hostname of a DoH upstream server
# (e.g. https://dns.google/dns-query) before dialing it. Each entry is a single
# endpoint spec; UDP ("1.1.1.1") and DoH ("https://1.1.1.1/dns-query") both
# work. Leave empty to let each instance use the system resolver. Edited from
# the Settings -> Upstream -> Bootstrap DNS panel too.
# upstream_bootstrap:
#   - address: "1.1.1.1"
#   - address: "https://1.1.1.1/dns-query"
# Pi-hole style blocklist sources: one or more AdBlock Plus (ABP) or hosts
# format lists. blipc fetches + merges them, then pushes the merged list to
# every blipd instance (and re-pushes on poll if an instance drifts). Edit
# from the web UI (Rules & Blocklist page) too. Empty list = nothing blocked.
# blocklist_sources:
#   - https://big.oisd.nl/domainswild2
#   - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
instances:
  # Add blipd instances here, or via the web UI at runtime.
  # token may be a literal, an "@/path" file, or an "/abs/path" file.
  # - id: office-dns
  #   label: "Office"
  #   url: "http://10.0.0.5:8444"
  #   token: "secret-token"

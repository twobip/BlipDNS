listen: "0.0.0.0:8500"
# Auth for the web UI / API. Empty = OPEN (no auth) — convenient for testing
# or a trusted management VLAN. Set a secret here (or via BLIPC_TOKEN) for
# production; the UI is then accessed with ?token=<secret>.
token: ""
instances:
  # Add blipd instances here, or via the web UI at runtime.
  # token may be a literal, an "@/path" file, or an "/abs/path" file.
  # - id: office-dns
  #   label: "Office"
  #   url: "http://10.0.0.5:8444"
  #   token: "secret-token"

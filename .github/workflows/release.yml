name: release

# Cut a GitHub release with pre-built static binaries whenever the VERSION file
# changes on master. The blipc release-check already reads the VERSION file from
# the branch; matching that bump to a tagged release ("v0.3.0") lets install and
# self-update download binaries instead of building from source on every node.
#
# Fast-forward merges carry the VERSION change through, so this fires on them.
# (If a --no-ff merge ever misses the trigger, use the manual dispatch below.)

on:
  push:
    branches:
      - master
    paths:
      - 'VERSION'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'

      - name: Read version
        id: version
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "release version: $V"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.value }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release v${{ steps.version.outputs.value }} already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static amd64 binaries
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          # Stamp the short commit SHA as SemVer build metadata so the
          # dashboard badge shows the exact build instead of "unknown build".
          STAMP="${VERSION}+$(git rev-parse --short=7 HEAD)"
          go build -trimpath -pgo=auto -ldflags "-s -w -X main.version=${STAMP}" -o blipd-linux-amd64 ./cmd/blipd
          go build -trimpath -pgo=auto -ldflags "-s -w -X github.com/twobip/BlipDNS/internal/controller.version=${STAMP}" -o blipc-linux-amd64 ./cmd/blipc
          go build -trimpath -pgo=auto -ldflags "-s -w -X main.version=${STAMP}" -o blipctl-linux-amd64 ./cmd/blipctl
          # The root-executed install helpers ship as release assets too so the
          # install scripts can SHA256-verify them like the binaries (a bare
          # curl of raw.githubusercontent would trust the mirror for root code).
          cp scripts/blipd-update.sh blipd-update.sh
          cp scripts/blipd-install.sh blipd-install.sh
          cp scripts/blipc-update.sh blipc-update.sh
          cp scripts/blipc-install.sh blipc-install.sh
          # Finding 21: ship the hardened systemd units as signed release
          # assets so the installers fetch them verified instead of
          # re-emitting weaker inline copies.
          cp deploy/blipd.service blipd.service
          cp deploy/blipc.service blipc.service
          sha256sum blipd-linux-amd64 blipc-linux-amd64 blipctl-linux-amd64 blipd-update.sh blipd-install.sh blipc-update.sh blipc-install.sh blipd.service blipc.service > SHA256SUMS
          echo "--- built artifacts ---"
          ls -la blipd-linux-amd64 blipc-linux-amd64 blipctl-linux-amd64 SHA256SUMS

      - name: Sign SHA256SUMS
        if: steps.check.outputs.exists == 'false'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Fail closed: installers refuse a missing .sig, so shipping
          # unsigned would strand every install. No silent fallback.
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY repo secret is not set — refusing to ship an unsigned release"
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          chmod 600 "$RUNNER_TEMP/signing.key"
          ssh-keygen -Y sign -f "$RUNNER_TEMP/signing.key" -n blipdns-release SHA256SUMS
          rm -f "$RUNNER_TEMP/signing.key"
          echo "--- signature ---"
          cat SHA256SUMS.sig

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          files=(blipd-linux-amd64 blipc-linux-amd64 blipctl-linux-amd64 blipd-update.sh blipd-install.sh blipc-update.sh blipc-install.sh blipd.service blipc.service SHA256SUMS)
          # .sig only exists once RELEASE_SIGNING_KEY is set (signing deferred).
          [ -f SHA256SUMS.sig ] && files+=(SHA256SUMS.sig)
          gh release create "v${VERSION}" \
            "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" \
            --generate-notes

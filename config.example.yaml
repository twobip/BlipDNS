dns_addr: "127.0.0.1:5353"
doh_addr: "127.0.0.1:8443"
admin_addr: "127.0.0.1:8444"
admin_token: "test-token"
# Only trust X-Forwarded-For from explicitly listed reverse proxies. Empty/off
# means use the direct peer address (recommended unless behind a proxy).
# trusted_proxies: ["127.0.0.1/32"]
# Upstream DNS resolvers - space/comma-separated specs for failover.
# Supported formats:
#   udp://host:port         - classic UDP/TCP DNS (e.g. udp://1.1.1.1:53)
#   https://host/dns-query  - DNS-over-HTTPS (RFC 8484)
#   doh://host/dns-query    - DNS-over-HTTPS (shorthand)
# Multiple specs provide failover (tried in order).
# An optional |priority suffix sets the failover order explicitly (lower
# number is tried first); specs without a suffix use their position (1-based).
# A resolver that fails is skipped for a short cooldown so a down primary
# fails over to the next priority immediately instead of stalling requests.
# Examples:
#   upstream: "udp://1.1.1.1:53 udp://8.8.8.8:53"
#   upstream: "https://1.1.1.1/dns-query https://8.8.8.8/dns-query"
#   upstream: "udp://1.1.1.1:53 https://1.1.1.1/dns-query"  # UDP primary, DoH failover
#   upstream: "udp://8.8.8.8:53|2 https://1.1.1.1/dns-query|1"  # DoH is primary
upstream: "udp://1.1.1.1:53 https://1.1.1.1/dns-query"
# Named upstream pool with conditional routing (optional). Each server gets a
# priority (0 = never forwarded to directly, route-only). Routes send matching
# queries to a named server; everything else follows the `upstream` failover
# list above.
# upstream_servers:
#   - name: "home"
#     address: "udp://192.168.1.1:53"
#     priority: 1
#   - name: "work-doh"
#     address: "https://dns.work.example/dns-query"
#     priority: 2
#     timeout_sec: 3            # per-server failover timeout (0 = 5s default)
# upstream_routes:
#   - name: "internal-to-home"
#     qname_suffix: "internal.example"   # queries ending in this go to "home"
#     server: "home"
#   - name: "corp-clients"
#     qname_suffix: ""                   # empty suffix matches all names
#     client_cidr: "10.0.0.0/8"          # ...from these clients only
#     server: "work-doh"
# Bootstrap DNS servers: used to resolve the hostname of a DoH upstream server
# (e.g. https://dns.google/dns-query) before dialing it. UDP ("1.1.1.1") and
# DoH ("https://1.1.1.1/dns-query") both work. Leave empty to use the system
# resolver.
# upstream_bootstrap:
#   - address: "1.1.1.1"
#   - address: "https://1.1.1.1/dns-query"
# DNS response cache (in-RAM). cache_cap caps how long any response may be
# cached regardless of its record TTL; cache_size bounds the number of cached
# responses (0 = unlimited, entries dropped on TTL expiry only).
cache_cap: 1h
cache_size: 10000
# Warm refresh: the most-popular N cached responses are re-resolved before
# they go stale so repeat clients always get fresh answers. Set count to 0
# to disable.
cache_warm_count: 100
cache_warm_ahead: 30s
cache_warm_interval: 10s
# Two-tier retention: popular entries (see cache_warm_count) are kept fresh by
# the warm loop above, while everything else is dropped after cache_regular.
# 0 = non-popular entries just follow each record's TTL.
# cache_regular: 5m

# DoH serving. doh_tls on means DoHAddr speaks HTTPS; a self-signed cert is
# auto-generated when cert_file/key_file are unset and persisted under tls_dir.
# doh_http_addr additionally exposes plain-HTTP DoH (RFC 8484) on its own port.
# doh_tls: true
# cert_file: "/etc/blipd/tls.crt"
# key_file: "/etc/blipd/tls.key"
# tls_dir: "/var/lib/blipd"
# doh_http_addr: "0.0.0.0:8053"

# Adoption/identity state. Persists the instance id + claim code so a restart
# doesn't regenerate them (the controller needs the claim code to bootstrap).
# state_file: "/var/lib/blipd/adopted.json"
# instance_id: "blipd-1"

# Global DNS blocklists (AdBlock Plus / hosts format), applied to ALL clients
# before per-client policy. Multiple feeds merge; blocklist_update_hours sets
# the auto-refresh interval (0 = fetch once at boot). blocklist_cache_file
# persists a snapshot so an unreachable feed doesn't blank filtering at boot.
# blocklist_urls:
#   - "https://example.com/easylist.txt"
#   - "https://example.com/hosts-ad.txt"
# blocklist_update_hours: 24
# blocklist_cache_file: "/var/lib/blipd/blocklist.cache"

default_policy:
  id: "default"
  block_action: "refused"

policies:
  - id: "kids"
    networks: ["192.168.10.0/24"]
    block:
      - "ads.example.com"
      - "*.tracker.net"
    allow:
      - "good.tracker.net"
    log: true
  - id: "office"
    networks: ["10.0.0.0/8"]
    block:
      - "timewaster.com"

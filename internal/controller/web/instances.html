<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlipDNS Controller — Instances</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>BlipDNS Controller</h1>
    <nav class="tabs">
      <a href="/?token={{TOKEN}}" class="tab" data-tab="dashboard">Dashboard</a>
      <a href="/stats.html?token={{TOKEN}}" class="tab" data-tab="stats">Stats</a>
      <a href="/instances.html?token={{TOKEN}}" class="tab active" data-tab="instances">Instances</a>
    </nav>
    <div id="conn" class="badge">connecting…</div>
  </header>

  <main>
    <section class="cards" id="instances"></section>
  </main>

  <!-- Add instance modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2>Add Instance</h2>
      <label>ID <input id="i-id" placeholder="office-dns" /></label>
      <label>Label <input id="i-label" placeholder="Office" /></label>
      <label>URL <input id="i-url" placeholder="http://10.0.0.5:8444" /></label>
      <label>Token <input id="i-token" type="password" placeholder="admin token (optional if using claim code)" /></label>
      <label>Claim code <input id="i-claim" placeholder="e.g. ABCD-1234 (from blipd journal, one-time)" /></label>
      <div class="modal-actions">
        <button id="i-cancel">Cancel</button>
        <button id="i-save" class="primary">Add</button>
      </div>
    </div>
  </div>

  <button id="add-btn" class="fab" title="Add instance">+</button>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>

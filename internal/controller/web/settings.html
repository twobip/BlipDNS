<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlipDNS Controller — Settings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<aside id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">&#x1F511;</span>
    <span class="brand-text">BlipDNS</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/?token={{TOKEN}}" data-nav="dashboard" class="nav-item">&#x1F4CA; Dashboard</a>
    <a href="/stats.html?token={{TOKEN}}" data-nav="stats" class="nav-item">&#x1F4C4; Stats</a>
    <a href="/instances.html?token={{TOKEN}}" data-nav="instances" class="nav-item">&#x1F4C4; Instances</a>
    <a href="/queries.html?token={{TOKEN}}" data-nav="queries" class="nav-item">&#x1F50D; Queries</a>
    <a href="/blocklist.html?token={{TOKEN}}" data-nav="blocklist" class="nav-item">&#x1F6AE; Blocklist</a>
    <a href="/settings.html?token={{TOKEN}}" data-nav="settings" class="nav-item active">&#x2699; Settings</a>
  </nav>
  <div class="sidebar-footer">
    <span id="sidebar-status" class="badge off">—</span>
  </div>
</aside>

<main id="main">
  <header id="topbar">
    <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar">&#9776;</button>
    <h2 id="page-title">Settings</h2>
    <div class="topbar-right">
      <span id="conn" class="badge off">connecting</span>
    </div>
  </header>

  <section class="view">
    <div class="panel">
      <h3>Upstream DNS</h3>
      <p class="sub">Space-separated specs (udp://host:port or https://host/dns-query).</p>
      <div class="form-row"><input id="s-upstream" type="text" placeholder="udp://1.1.1.1:53 https://1.1.1.1/dns-query" /></div>
      <button id="s-save" class="btn-primary">Save Upstream</button>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>

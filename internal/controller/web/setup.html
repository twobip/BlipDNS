<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Set up — BlipDNS Controller</title>
<link rel="icon" href="favicon.svg"/>
<link rel="stylesheet" href="style.css"/>
<style>
  body { min-height: 100vh; display: grid; place-items: center; background:
    radial-gradient(900px 500px at 20% 0%, rgba(79,140,255,.08), transparent 55%),
    radial-gradient(800px 500px at 85% 100%, rgba(56,182,255,.06), transparent 55%), var(--bg); }
  .setup-card { width: 100%; max-width: 440px; background: var(--surface-2);
    border: 1px solid var(--border-2); border-radius: 16px; box-shadow: var(--shadow-2);
    padding: 36px 32px 30px; animation: pop .25s cubic-bezier(.2,.9,.3,1.1); }
  .setup-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px; text-align: center; }
  .setup-brand .mark { width: 44px; height: 44px; border-radius: 13px; background: var(--accent-grad);
    display: grid; place-items: center; box-shadow: 0 6px 20px rgba(79,140,255,.4); }
  .setup-brand .mark svg { width: 24px; height: 24px; }
  .setup-brand h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
  .setup-brand p { margin: 0; color: var(--muted); font-size: 12.5px; max-width: 330px; }
  .setup-form { display: flex; flex-direction: column; gap: 14px; }
  .setup-err { display: none; font-size: 12.5px; color: #ff9a9a; background: rgba(247,107,107,.09);
    border: 1px solid rgba(247,107,107,.25); border-radius: 8px; padding: 9px 12px; }
  .setup-err.show { display: block; }
  .setup-btn { width: 100%; justify-content: center; padding: 11px; font-size: 13.5px; margin-top: 4px; }
  .setup-note { margin-top: 18px; text-align: center; font-size: 11.5px; color: var(--faint); }
</style>
</head>
<body>
  <div class="setup-card">
    <div class="setup-brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 4.5 6v5.5c0 4.8 3.1 7.9 7.5 9.5 4.4-1.6 7.5-4.7 7.5-9.5V6L12 3Z"/>
          <path d="m8.5 12 2.2 2.2 4.8-5"/>
        </svg>
      </div>
      <h1>Set up your BlipDNS console</h1>
      <p>Create the administrator account for this controller. Your password is stored as a one-way bcrypt hash.</p>
    </div>
    <div class="setup-err" id="setup-err"></div>
    <form class="setup-form" id="setup-form" autocomplete="off">
      <div class="field"><label for="setup-user">Username</label>
        <input class="input" id="setup-user" autocomplete="username" minlength="1" maxlength="64" required autofocus /></div>
      <div class="field"><label for="setup-pass">Password</label>
        <input class="input" id="setup-pass" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
        <span class="hint">Use at least 8 characters.</span></div>
      <div class="field"><label for="setup-confirm">Confirm password</label>
        <input class="input" id="setup-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required /></div>
      <button class="btn btn-primary setup-btn" id="setup-btn" type="submit"><span id="setup-label">Create account</span></button>
    </form>
    <div class="setup-note">This setup page is available only until the first account is created. Use it on a trusted network or behind HTTPS.</div>
  </div>
<script src="setup.js"></script>
</body>
</html>

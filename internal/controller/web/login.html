<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in — BlipDNS Controller</title>
<link rel="icon" href="favicon.svg"/>
<link rel="stylesheet" href="style.css"/>
<style>
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    background:
      radial-gradient(900px 500px at 20% 0%, rgba(79,140,255,.08), transparent 55%),
      radial-gradient(800px 500px at 85% 100%, rgba(56,182,255,.06), transparent 55%),
      var(--bg);
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: var(--surface-2);
    border: 1px solid var(--border-2); border-radius: 16px;
    box-shadow: var(--shadow-2);
    padding: 36px 32px 30px;
    animation: pop .25s cubic-bezier(.2,.9,.3,1.1);
  }
  .login-brand {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    margin-bottom: 26px;
  }
  .login-brand .mark {
    width: 44px; height: 44px; border-radius: 13px;
    background: var(--accent-grad);
    display: grid; place-items: center;
    box-shadow: 0 6px 20px rgba(79,140,255,.4);
  }
  .login-brand .mark svg { width: 24px; height: 24px; }
  .login-brand h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .login-brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .login-form { display: flex; flex-direction: column; gap: 14px; }
  .login-form .field { gap: 7px; }
  .login-err {
    display: none;
    font-size: 12.5px; color: #ff9a9a;
    background: rgba(247,107,107,.09); border: 1px solid rgba(247,107,107,.25);
    border-radius: 8px; padding: 9px 12px;
  }
  .login-err.show { display: block; }
  .login-btn {
    width: 100%; justify-content: center; padding: 11px;
    font-size: 13.5px; margin-top: 4px;
  }
  .login-foot { margin-top: 18px; text-align: center; font-size: 11.5px; color: var(--faint); }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/>
        </svg>
      </div>
      <h1>Sign in to BlipDNS</h1>
      <p>Controller console</p>
    </div>

    <div class="login-err" id="login-err"></div>

    <form class="login-form" id="login-form" method="post" action="/api/login" autocomplete="on">
      <div class="field">
        <label for="f-user">Username</label>
        <input class="input" id="f-user" name="username" autocomplete="username" required autofocus/>
      </div>
      <div class="field">
        <label for="f-pass">Password</label>
        <input class="input" id="f-pass" name="password" type="password" autocomplete="current-password" required/>
      </div>
      <button class="btn btn-primary login-btn" id="login-btn" type="submit">
        <span id="login-btn-label">Sign in</span>
      </button>
    </form>
    <div class="login-foot">Managed recursive DNS, one console.</div>
  </div>

<script src="login.js"></script>
</body>
</html>

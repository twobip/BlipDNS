<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlipDNS Controller — Blocklist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<aside id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">&#x1F511;</span>
    <span class="brand-text">BlipDNS</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/?token={{TOKEN}}" data-nav="dashboard" class="nav-item">&#x1F4CA; Dashboard</a>
    <a href="/stats.html?token={{TOKEN}}" data-nav="stats" class="nav-item">&#x1F4C4; Stats</a>
    <a href="/instances.html?token={{TOKEN}}" data-nav="instances" class="nav-item">&#x1F4C4; Instances</a>
    <a href="/queries.html?token={{TOKEN}}" data-nav="queries" class="nav-item">&#x1F50D; Queries</a>
    <a href="/blocklist.html?token={{TOKEN}}" data-nav="blocklist" class="nav-item active">&#x1F6AE; Blocklist</a>
    <a href="/settings.html?token={{TOKEN}}" data-nav="settings" class="nav-item">&#x2699; Settings</a>
  </nav>
  <div class="sidebar-footer">
    <span id="sidebar-status" class="badge off">—</span>
  </div>
</aside>

<main id="main">
  <header id="topbar">
    <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar">&#9776;</button>
    <h2 id="page-title">Blocklist</h2>
    <div class="topbar-right">
      <span id="conn" class="badge off">connecting</span>
    </div>
  </header>

  <section class="view">
    <div class="panel blocklist-panel">
      <h3>Global DNS Blocklist</h3>
      <p class="sub">Blocked domains apply to ALL clients before per-client policy.</p>
      <div class="blocklist-actions">
        <input id="bl-add-input" placeholder="domain.example.com" />
        <button id="bl-add" class="btn-primary">Add</button>
      </div>
      <div class="blocklist-actions">
        <input id="bl-url-input" placeholder="AdBlock Plus URL…" />
        <button id="bl-import-url" class="btn-primary">Import URL</button>
        <label class="btn-file"><input type="file" id="bl-file-input" accept=".txt,.csv,.conf" hidden/>Choose File</label>
        <button id="bl-import-file" class="btn-primary" disabled>Import File</button>
      </div>
      <div class="blocklist-actions toolbar">
        <span id="bl-import-status" class="muted"></span>
        <input id="bl-filter" placeholder="filter…" />
        <button id="bl-export">Export</button>
        <button id="bl-clear" class="btn-danger">Clear All</button>
      </div>
      <ul id="blockList" class="blocklist"></ul>
      <div id="bl-count" class="muted"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>

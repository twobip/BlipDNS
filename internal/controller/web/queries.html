<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlipDNS Controller — Queries</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<aside id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">&#x1F511;</span>
    <span class="brand-text">BlipDNS</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/?token={{TOKEN}}" data-nav="dashboard" class="nav-item">&#x1F4CA; Dashboard</a>
    <a href="/stats.html?token={{TOKEN}}" data-nav="stats" class="nav-item">&#x1F4C4; Stats</a>
    <a href="/instances.html?token={{TOKEN}}" data-nav="instances" class="nav-item">&#x1F4C4; Instances</a>
    <a href="/queries.html?token={{TOKEN}}" data-nav="queries" class="nav-item active">&#x1F50D; Queries</a>
    <a href="/blocklist.html?token={{TOKEN}}" data-nav="blocklist" class="nav-item">&#x1F6AE; Blocklist</a>
    <a href="/settings.html?token={{TOKEN}}" data-nav="settings" class="nav-item">&#x2699; Settings</a>
  </nav>
  <div class="sidebar-footer">
    <span id="sidebar-status" class="badge off">—</span>
  </div>
</aside>

<main id="main">
  <header id="topbar">
    <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar">&#9776;</button>
    <h2 id="page-title">Queries</h2>
    <div class="topbar-right">
      <span id="conn" class="badge off">connecting</span>
    </div>
  </header>

  <section class="view">
    <div class="toolbar">
      <input id="f-domain" placeholder="filter domain/client…" />
    </div>
    <div id="query-log" class="events"></div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
